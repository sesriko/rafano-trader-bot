name: Rafano Trader Signal Engine

on:
  schedule:
    # Berjalan setiap 15 menit selama jam bursa (Senin-Jumat, 02:00 - 09:00 UTC / 09:00 - 16:00 WIB)
    - cron: '*/15 2-9 * * 1-5'
  workflow_dispatch: # Memungkinkan eksekusi manual dari tab Actions GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance ta

      - name: Run Rafano Engine with Auto-Login
        env:
          TELEGRAM_BOT_TOKEN: '8833563003:AAGSx750u_QXWpr91sd3yuD6LcnMXtWWrxQ'
          TELEGRAM_CHAT_ID: '5660874676'
          STOCKBIT_USERNAME: ${{ secrets.STOCKBIT_USERNAME }}
          STOCKBIT_PASSWORD: ${{ secrets.STOCKBIT_PASSWORD }}
        run: python rafano_trader_bot.py

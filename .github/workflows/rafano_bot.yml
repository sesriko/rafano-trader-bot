name: Rafano Trader Bot Engine

on:
  schedule:
    # Jadwal Running Otomatis (Format Jam UTC):
    # Jam bursa WIB (UTC+7) -> 09:15 WIB = 02:15 UTC
    - cron: '15 2 * * 1-5'   # Sesi 1: 09:15 WIB (Senin-Jumat)
    - cron: '45 3 * * 1-5'   # Sesi 1: 10:45 WIB (Senin-Jumat)
    - cron: '45 6 * * 1-5'   # Sesi 2: 13:45 WIB (Senin-Jumat)
    - cron: '30 8 * * 1-5'   # Sesi 2: 15:30 WIB (Senin-Jumat)
  workflow_dispatch:          # Menambahkan tombol "Run workflow" untuk tes manual

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Rafano Engine with Auto-Login
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        STOCKBIT_USERNAME: ${{ secrets.STOCKBIT_USERNAME }}
        STOCKBIT_PASSWORD: ${{ secrets.STOCKBIT_PASSWORD }}
      run: python autoscan.py
